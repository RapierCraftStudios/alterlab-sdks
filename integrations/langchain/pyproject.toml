[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "langchain-alterlab"
version = "0.1.1"
description = "LangChain integration for AlterLab web scraping API"
authors = ["AlterLab <dev@alterlab.io>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/RapierCraftStudios/alterlab-sdks"
homepage = "https://alterlab.io"
documentation = "https://alterlab.io/docs/integrations/langchain"
keywords = ["langchain", "alterlab", "web-scraping", "document-loader", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
packages = [{ include = "langchain_alterlab" }]

[tool.poetry.urls]
"Source" = "https://github.com/RapierCraftStudios/alterlab-sdks/tree/main/integrations/langchain"
"Bug Tracker" = "https://github.com/RapierCraftStudios/alterlab-sdks/issues"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
langchain-core = ">=0.3.0,<1.0"
alterlab = ">=2.4.3"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
