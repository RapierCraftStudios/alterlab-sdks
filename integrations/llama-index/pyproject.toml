[tool.poetry]
name = "llama-index-readers-alterlab"
version = "0.2.1"
description = "LlamaIndex data reader for AlterLab web scraping API"
authors = ["AlterLab <dev@alterlab.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://alterlab.io"
repository = "https://github.com/RapierCraftStudios/alterlab-sdks"
documentation = "https://alterlab.io/docs/integrations/llamaindex"
keywords = ["llama-index", "web-scraping", "rag", "data-reader", "alterlab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{include = "llama_index"}]

[tool.poetry.urls]
"Source" = "https://github.com/RapierCraftStudios/alterlab-sdks/tree/main/integrations/llama-index"
"Bug Tracker" = "https://github.com/RapierCraftStudios/alterlab-sdks/issues"

[tool.poetry.dependencies]
python = "^3.8"
alterlab = ">=2.4.3"
llama-index-core = ">=0.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
line_length = 88
