[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "crewai-alterlab"
version = "0.1.2"
description = "CrewAI integration for AlterLab web scraping API"
authors = ["AlterLab <dev@alterlab.io>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/RapierCraftStudios/alterlab-sdks"
homepage = "https://alterlab.io"
documentation = "https://alterlab.io/docs/integrations/crewai"
keywords = ["crewai", "alterlab", "web-scraping", "ai-agents", "web-crawler", "scraping-tool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
packages = [{ include = "crewai_alterlab" }]

[tool.poetry.urls]
"Source" = "https://github.com/RapierCraftStudios/alterlab-sdks/tree/main/integrations/crewai"
"Bug Tracker" = "https://github.com/RapierCraftStudios/alterlab-sdks/issues"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
crewai = {version = ">=0.150.0", extras = ["tools"]}
alterlab = ">=2.4.3"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
