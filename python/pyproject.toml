[tool.poetry]
name = "alterlab"
version = "2.4.5"
description = "Official Python client for AlterLab: search, read and extract the live web, with automatic fallback from direct fetch to full browser rendering. Pay only for successful requests."
license = "MIT"
readme = "README.md"
include = ["alterlab/data/*.json", "alterlab/cli_local/*.json"]
authors = ["AlterLab <dev@alterlab.io>"]
homepage = "https://alterlab.io"
repository = "https://github.com/RapierCraftStudios/alterlab-sdks"
documentation = "https://alterlab.io/docs/sdk/python"
keywords = ["alterlab", "web-scraping", "web-data", "scraping-api", "ai-agents", "llm", "search-api", "markdown", "cli", "mcp"]

[tool.poetry.scripts]
alterlab = "alterlab.cli:main"

[tool.poetry.urls]
"Source" = "https://github.com/RapierCraftStudios/alterlab-sdks/tree/main/python"
"Bug Tracker" = "https://github.com/RapierCraftStudios/alterlab-sdks/issues"

[tool.poetry.dependencies]
python = "^3.8"
httpx = ">=0.25.2,<1.0"
pydantic = "^2.5.0"
typing_extensions = ">=3.7.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
line_length = 88
